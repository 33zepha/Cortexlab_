name: UI visual proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'runtime/**'
      - 'server/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/ui-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Run runtime and observability tests
        run: npm test

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build React application
        working-directory: web
        run: npm run build

      - name: Install Chromium capture tool
        working-directory: web
        run: npx --yes playwright@1.48.2 install --with-deps chromium

      - name: Start preview server
        working-directory: web
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cortex-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:4173/?demo=1' > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cortex-vite.log
          exit 1

      - name: Capture dashboard
        working-directory: web
        run: |
          mkdir -p artifacts
          npx --yes playwright@1.48.2 screenshot \
            --viewport-size='1536,1024' \
            --wait-for-timeout=1200 \
            --full-page \
            'http://127.0.0.1:4173/?demo=1' \
            artifacts/cortex-dashboard.png

      - name: Capture mission inspector
        working-directory: web
        run: |
          npx --yes playwright@1.48.2 screenshot \
            --viewport-size='1536,1024' \
            --wait-for-timeout=1200 \
            'http://127.0.0.1:4173/?demo=1&mission=m_018f2a1b' \
            artifacts/cortex-mission-inspector.png

      - name: Capture agent inspector
        working-directory: web
        run: |
          npx --yes playwright@1.48.2 screenshot \
            --viewport-size='1536,1024' \
            --wait-for-timeout=1200 \
            'http://127.0.0.1:4173/?demo=1&agent=AG-HERMES' \
            artifacts/cortex-agent-inspector.png

      - name: Capture ledger explorer
        working-directory: web
        run: |
          npx --yes playwright@1.48.2 screenshot \
            --viewport-size='1536,1024' \
            --wait-for-timeout=1200 \
            'http://127.0.0.1:4173/?demo=1&ledger=1' \
            artifacts/cortex-ledger-explorer.png

      - name: Capture mobile dashboard
        working-directory: web
        run: |
          npx --yes playwright@1.48.2 screenshot \
            --viewport-size='390,844' \
            --wait-for-timeout=1200 \
            --full-page \
            'http://127.0.0.1:4173/?demo=1' \
            artifacts/cortex-mobile-dashboard.png

      - name: Capture mobile agent inspector
        working-directory: web
        run: |
          npx --yes playwright@1.48.2 screenshot \
            --viewport-size='390,844' \
            --wait-for-timeout=1200 \
            'http://127.0.0.1:4173/?demo=1&agent=AG-HERMES' \
            artifacts/cortex-mobile-agent-inspector.png

      - name: Upload visual proofs
        uses: actions/upload-artifact@v4
        with:
          name: cortex-mission-control-proof
          path: web/artifacts/*.png
          if-no-files-found: error
          retention-days: 14
