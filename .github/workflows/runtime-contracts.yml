name: runtime-contracts
on:
  pull_request:
    branches: [main, feat/role-model-separation]
    paths:
      - 'contracts/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'test/**'
      - 'manifests/**'
      - 'constitution/**'
      - 'registry/**'
      - 'package.json'
      - 'package-lock.json'
      - 'generate-registry.mjs'
      - '.github/workflows/runtime-contracts.yml'
  push:
    branches: [feat/role-model-separation, feat/session-runner-v1]
    paths:
      - 'contracts/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'generate-registry.mjs'
      - '.github/workflows/runtime-contracts.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Registry verify
        run: node generate-registry.mjs --verify
      - name: Clean tree after generate
        run: git diff --exit-code
      - name: YAML parse contracts
        run: |
          node --input-type=module -e "
          import yaml from 'js-yaml';
          import fs from 'fs';
          import path from 'path';
          const dir='contracts';
          for (const f of fs.readdirSync(dir).filter(x=>x.endsWith('.yaml'))) {
            yaml.load(fs.readFileSync(path.join(dir,f),'utf8'));
            console.log('ok', f);
          }
          "
      - name: Secret scan proofs
        run: |
          if grep -REn 'sk-[a-zA-Z0-9]{10,}|ghp_|BEGIN PRIVATE' docs/proofs contracts 2>/dev/null; then
            echo 'secret-like content found'; exit 1
          fi
          echo 'secret scan clean'
      - name: No IA CLI invocation in workflow
        run: |
          # Detect real invocations (commands), not this grep pattern itself.
          # Fail if a run step starts a model CLI as a command.
          if grep -En '^[[:space:]]+(run:[[:space:]]*)?(claude|codex|kimi|grok)([[:space:]]|$)' .github/workflows/*.yml; then
            echo 'workflow must not invoke IA CLIs'; exit 1
          fi
          echo 'workflow clean'
