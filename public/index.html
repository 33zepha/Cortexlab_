<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortex Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">Cortex</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <span class="nav-group-label">Monitor</span>
          <a class="nav-item active" href="#dashboard">Dashboard</a>
          <a class="nav-item" href="#activity">Activity</a>
          <a class="nav-item" href="#live">Live</a>
          <a class="nav-item" href="#history">History</a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Orchestrate</span>
          <a class="nav-item" href="#agents">Agents</a>
          <a class="nav-item" href="#missions">Missions</a>
          <a class="nav-item" href="#playbooks">Playbooks</a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Delegate</span>
          <a class="nav-item" href="#integrations">Integrations</a>
          <a class="nav-item" href="#events">Events</a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">Analytics</span>
          <a class="nav-item" href="#reports">Reports</a>
          <a class="nav-item" href="#cost">Cost</a>
          <a class="nav-item" href="#usage">Usage</a>
        </div>
      </nav>

      <div class="sidebar-profile">
        <div class="profile-avatar">D</div>
        <div class="profile-meta">
          <span class="profile-name">drix</span>
          <span class="profile-role">Gouverneur</span>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <!-- ----- TOP BAR ----- -->
      <header class="topbar">
        <h1 class="page-title">Console</h1>
        <div class="topbar-actions">
          <input class="search-input" type="search" placeholder="Rechercher un agent, une mission…" aria-label="Rechercher" />
          <button class="button-ghost" type="button">Filters</button>
          <button class="button-primary" id="run-mission-btn" type="button">+ Run Mission</button>
        </div>
      </header>

      <!-- ----- KPI ROW ----- -->
      <section class="kpi-row" aria-label="Indicateurs clés">
        <div class="card kpi-card">
          <span class="kpi-label">Active Managers</span>
          <span class="kpi-value" id="kpi-managers">—</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-label">Missions (24h)</span>
          <span class="kpi-value" id="kpi-missions">—</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-label">Closures autonomes</span>
          <span class="kpi-value" id="kpi-closures">—</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-label">Dernier run</span>
          <span class="kpi-value" id="kpi-last-run">—</span>
        </div>
      </section>

      <!-- ----- AGENTS GRID ----- -->
      <section class="section" aria-label="Agents">
        <div class="section-head">
          <h2 class="section-title">Agents</h2>
          <span class="section-sub" id="agents-count"></span>
        </div>
        <div class="agents-grid" id="agents-grid">
          <!-- les cartes agents sont injectées par app.js -->
        </div>
      </section>

      <!-- ----- LIVE FEED ----- -->
      <section class="section" aria-label="Activity">
        <div class="section-head">
          <h2 class="section-title">Activity</h2>
          <span class="badge-running live-dot">Live</span>
        </div>
        <div class="card feed-card">
          <div class="feed" id="feed">
            <!-- les lignes d'activité sont injectées par app.js via SSE -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
