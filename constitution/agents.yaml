# Agents gouvernés — source canonique (derivation, pas dupliquee)
#
# Modele d'entreprise Cortex (rapport deep-research) :
#   Hermes = CEO qui raisonne H24 (orchestration globale)
#   Managers = IAs de haut niveau qui orchestrent les salaries
#   Salaries = agents/workers execution
# Toutes les IAs branchees sont utilisees ; optimisation par rapports concis
# de chaque IA -> meilleure qualite, couts diminues.
#
# Ce fichier est la VERITE sur les entites. manifests/agents.json ne porte que
# les metadonnees ; generate-registry.mjs tire le reste d'ici.

agents:
  - id: AG-CLAUDE
    name: Claude
    provider: anthropic
    tier: manager
    reports_to: AG-HERMES
    model: claude-opus-4-8
    role: "Manager produit/strategie et UX : analyse, critique, specification UI, direction produit, revue visuelle"
    # strengths = TOKENS machine pour le router. UI/UX n'est PAS une aptitude unique.
    # Implementation frontend = Codex (code/tests/correction).
    strengths:
      - raisonnement
      - redaction
      - conformite
      - analyse
      - critique
      - conseil
      - analyse-ux
      - critique-ux
      - specification-ui
      - direction-produit
      - revue-visuelle
    domain_expertise:
      - product_strategy
      - ux_analysis
      - ui_specification
      - visual_review
      - critique
    cost_index: 1.7          # relatif (1.0 = base)
    quality_index: 0.95
    status: active

  - id: AG-KIMI
    name: Kimi
    provider: moonshot
    tier: manager
    reports_to: AG-HERMES
    model: kimi-k3
    role: "Manager recherche/donnees : synthese long contexte, reporting dense"
    strengths: [long-context, recherche, resume]
    cost_index: 0.8
    quality_index: 0.88
    status: active

  - id: AG-HERMES
    name: Hermes
    provider: nous
    tier: ceo
    model: hy3
    role: "CEO : raisonne H24, orchestration des managers, decisions de closure"
    strengths: [orchestration, outils, multi-IA, raisonnement-metis]
    cost_index: 0.4
    quality_index: 0.90
    status: active

  # Codex = CHIEF ENGINEER de Cortex. Autorite technique de premier rang,
  # rattachee directement a Hermes Il detient l'autorite
  # finale sur l'ingenierie du depot : architecture d'implementation, code,
  # tests, corrections, qualite logicielle.
  #
  # tier: manager -> candidat du router (INV-011). Il gouverne son cycle
  # technique mais ne produit PAS de closure : la gouvernance reste au Chief of
  # Staff (INV-006) et la closure a Hermes. Autorite technique != autorite de
  # gouvernance.
  #
  # NOTE strengths : ce sont des TOKENS machine matches par router.mjs
  # (requiredStrengths), pas de la prose. La description humaine des forces est
  # dans `capabilities`, qui n'entre pas dans le scoring.
  - id: AG-CODEX
    name: Codex
    provider: openai
    tier: manager
    reports_to: AG-HERMES
    model: gpt-5.6-luna
    reasoning_effort: max
    role: "Chief Engineer de Cortex : autorite technique responsable de l'architecture d'implementation, du code, des tests, des corrections et de la qualite logicielle finale."
    strengths: [code, tests, correction, refactoring, debugging, securite-code, autonomie]
    domain_expertise:
      - software_engineering
      - system_architecture
      - implementation
      - debugging
      - testing
      - refactoring
      - migrations
      - technical_debt
      - code_security
      - release_readiness
    capabilities:
      - raisonnement technique profond
      - comprehension globale du depot
      - developpement autonome de bout en bout
      - resolution de bugs complexes
      - refactorisation multi-fichiers
      - conception de tests
      - verification par preuves
    cost_index: 0.7
    quality_index: 0.98
    status: active

  # Luna Max = executant d'ingenierie. Meme famille de modele que le Chief
  # Engineer, en mode Max reasoning. Il rend compte a AG-CODEX (autorite
  # technique).
  # tier worker -> jamais candidat du router (INV-011), il recoit un mandat.
  # Luna Max = executant d'ingenierie. Meme famille de modele que le Chief
  # Engineer, en mode Max reasoning. Il rend compte a AG-CODEX (autorite
  # technique). tier worker -> jamais candidat du router (INV-011), il recoit un mandat.
  - id: AG-LUNA
    name: "Luna Max"
    provider: openai
    tier: worker
    reports_to: AG-CODEX
    model: gpt-5.6-luna
    role: "Executant d'ingenierie (Max reasoning) : boucle plan/code/test/correct sous mandat du Chief Engineer, produit preuves, rend au CoS"
    strengths: [code, long-context, autonomie, tests, correction]
    cost_index: 0.6          # < Kimi : haut-volume, long contexte, multimodal, peu couteux
    quality_index: 0.93
    status: active
