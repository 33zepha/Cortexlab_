# Agents gouvernés — source canonique (derivation, pas dupliquee)
#
# =============================================================================
# ARCHITECTURE TRANSITOIRE DE COMPATIBILITÉ
# =============================================================================
# Ce fichier reste la VERITE machine pour le runtime actuel
# (manifests/agents.json + generate-registry.mjs → registry/registry.json).
#
# Les entrees ci-dessous FUSIONNENT TEMPORAIREMENT :
#   - un role organisationnel (ceo / manager / worker)
#   - un modele ou une variante de modele (Claude, Codex, Kimi, Luna, HY3)
#
# Ce n'est PAS l'organigramme cible definitif.
#
# Cible validee :
#   Boss
#   → Hermes (entree conversationnelle + closure)
#   → Chief of Staff (orchestration globale)
#   → managers metier (Engineering, Product & Experience, Research, Mnemosyne)
#   → agents specialises
#   → selection dynamique du modele
#   → selection dynamique de l'effort
#   → execution, preuves, evaluation
#
# Claude, Codex, Kimi, Luna Max et HY3 Free = modeles / variantes, pas l'org finale.
# Migration dediee : feat/role-model-separation
# Antigravity / Gemini : absents de l'architecture active.
# =============================================================================
#
# manifests/agents.json ne porte que les metadonnees (id, tier, source) ;
# generate-registry.mjs tire le reste d'ici.

agents:
  - id: AG-CLAUDE
    name: Claude
    provider: anthropic
    tier: manager
    reports_to: AG-HERMES
    model: claude-opus-4-8
    # BINDING TRANSITOIRE : role org + modele Claude fusionnes (compat runtime).
    # Pas le Product & Experience Manager definitif.
    role: "BINDING TRANSITOIRE — Manager produit/strategie et UX : analyse, critique, specification UI, direction produit, revue visuelle"
    architecture_status: transitional_compatibility
    role_binding: transitional
    # strengths = TOKENS machine pour le router. UI/UX n'est PAS une aptitude unique.
    # Implementation frontend = binding Codex temporaire (code/tests/correction).
    strengths:
      - raisonnement
      - redaction
      - conformite
      - analyse
      - critique
      - conseil
      - analyse-ux
      - critique-ux
      - specification-ui
      - direction-produit
      - revue-visuelle
    domain_expertise:
      - product_strategy
      - ux_analysis
      - ui_specification
      - visual_review
      - critique
    cost_index: 1.7          # relatif (1.0 = base)
    quality_index: 0.95
    status: active

  - id: AG-KIMI
    name: Kimi
    provider: moonshot
    tier: manager
    reports_to: AG-HERMES
    model: kimi-k3
    # BINDING TRANSITOIRE : role org + modele Kimi fusionnes (compat runtime).
    # Pas le Research Manager definitif.
    role: "BINDING TRANSITOIRE — Manager recherche/donnees : synthese long contexte, reporting dense"
    architecture_status: transitional_compatibility
    role_binding: transitional
    strengths: [long-context, recherche, resume]
    cost_index: 0.8
    quality_index: 0.88
    status: active

  - id: AG-HERMES
    name: Hermes
    provider: nous
    tier: ceo
    model: hy3
    # BINDING TRANSITOIRE : role CEO + modele HY3 par defaut fusionnes.
    # Hermes reste l'entree/closure ; HY3 n'est pas l'identite organisationnelle.
    role: "BINDING TRANSITOIRE — CEO : raisonne H24, orchestration des managers, decisions de closure"
    architecture_status: transitional_compatibility
    role_binding: transitional
    strengths: [orchestration, outils, multi-IA, raisonnement-metis]
    cost_index: 0.4
    quality_index: 0.90
    status: active

  # BINDING TRANSITOIRE — AG-CODEX fusionne aujourd'hui :
  #   role d'autorite technique d'ingenierie + famille/modele Codex (gpt-5.6-luna).
  # Ce n'est PAS le Engineering Manager metier definitif (MGR-ENGINEERING).
  # tier: manager -> candidat du router (INV-011). Pas de closure (INV-006).
  # strengths = TOKENS machine (router.mjs) ; prose humaine dans capabilities.
  - id: AG-CODEX
    name: Codex
    provider: openai
    tier: manager
    reports_to: AG-HERMES
    model: gpt-5.6-luna
    # TRANSITOIRE — effort fige sur l'entite agent ; cible = effort au niveau session/mandat.
    reasoning_effort: max
    reasoning_effort_binding: transitional
    role: "BINDING TRANSITOIRE — Chief Engineer de Cortex : autorite technique responsable de l'architecture d'implementation, du code, des tests, des corrections et de la qualite logicielle finale."
    architecture_status: transitional_compatibility
    role_binding: transitional
    strengths: [code, tests, correction, refactoring, debugging, securite-code, autonomie]
    domain_expertise:
      - software_engineering
      - system_architecture
      - implementation
      - debugging
      - testing
      - refactoring
      - migrations
      - technical_debt
      - code_security
      - release_readiness
    capabilities:
      - raisonnement technique profond
      - comprehension globale du depot
      - developpement autonome de bout en bout
      - resolution de bugs complexes
      - refactorisation multi-fichiers
      - conception de tests
      - verification par preuves
    cost_index: 0.7
    quality_index: 0.98
    status: active

  # BINDING TRANSITOIRE — AG-LUNA fusionne worker d'execution + variante Luna Max.
  # Cible : plus d'identite org AG-LUNA ; Luna Max = variante modele sous catalogue codex.
  # tier worker -> jamais candidat du router (INV-011) ; recoit un mandat.
  - id: AG-LUNA
    name: "Luna Max"
    provider: openai
    tier: worker
    reports_to: AG-CODEX
    model: gpt-5.6-luna
    role: "BINDING TRANSITOIRE — Executant d'ingenierie (Max reasoning) : boucle plan/code/test/correct sous mandat du Chief Engineer, produit preuves, rend au CoS"
    architecture_status: transitional_compatibility
    role_binding: transitional
    strengths: [code, long-context, autonomie, tests, correction]
    cost_index: 0.6          # < Kimi : haut-volume, long contexte, multimodal, peu couteux
    quality_index: 0.93
    status: active
