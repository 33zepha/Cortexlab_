# Mapping de compatibilité TRANSITOIRE uniquement.
schema_version: 2
kind: transitional_bindings
status: transitional
deprecated: true
removal_condition:
  - e2e_v2_green
  - all_consumers_migrated
  - boss_approved_cutover
note: >
  Bindings AG-* → rôles/modèles pour dual-read et legacy prep.
  Pas l'organigramme définitif. Luna n'est pas un rôle org.

bindings:
  - legacy_agent_id: AG-HERMES
    maps_role_to: ROLE-HERMES
    default_model_family: hy3
    default_model_variant: tencent/hy3:free
    default_effort: low
    note: Hermes role remains; HY3 default engine today only.

  - legacy_agent_id: AG-CODEX
    maps_role_to: MGR-ENGINEERING
    default_model_family: codex
    default_model_variant: gpt-5.6-luna
    default_effort: high
    note: Temporary technical authority binding; target is métier manager.

  - legacy_agent_id: AG-CLAUDE
    maps_role_to: MGR-PRODUCT-EXPERIENCE
    default_model_family: claude
    default_model_variant: claude-opus-4-8
    default_effort: high
    note: Temporary UX/spec binding.

  - legacy_agent_id: AG-KIMI
    maps_role_to: MGR-RESEARCH
    default_model_family: kimi
    default_model_variant: k3
    default_effort: high
    note: Temporary research binding. Variant id is k3 not kimi-k3.

  - legacy_agent_id: AG-LUNA
    maps_role_to: null
    default_model_family: codex
    default_model_variant: gpt-5.6-luna
    default_effort: max
    note: >
      Luna Max is NOT an org role. Alias luna/luna-max resolves to gpt-5.6-luna.

chief_of_staff:
  role_id: ROLE-CHIEF-OF-STAFF
  legacy_agent_id: null
  implementation_today: runtime/chief-of-staff.mjs
