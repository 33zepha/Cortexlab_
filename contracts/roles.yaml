schema_version: 1
kind: role_catalog
status: draft_parallel
roles:
- id: ROLE-HERMES
  kind: ceo
  name: Hermes
  reports_to: null
  responsibilities:
  - conversational_entry
  - mission_creation
  - final_closure
  must_not:
  - direct_technical_execution
- id: ROLE-CHIEF-OF-STAFF
  kind: chief_of_staff
  name: Chief of Staff
  reports_to: ROLE-HERMES
  responsibilities:
  - mission_decomposition
  - manager_selection
  - budgets
  - proof_requirements
  - stop_conditions
  - escalation
  - prepare_closure
  must_not:
  - be_an_ai_model_identity
  - final_closure_without_hermes
- id: MGR-ENGINEERING
  kind: manager
  name: Engineering Manager
  reports_to: ROLE-CHIEF-OF-STAFF
  domain: engineering
  responsibilities:
  - staff_specialized_agents
  - verify_technical_proofs
  - return_structured_result
- id: MGR-PRODUCT-EXPERIENCE
  kind: manager
  name: Product & Experience Manager
  reports_to: ROLE-CHIEF-OF-STAFF
  domain: product_experience
  responsibilities:
  - ux_analysis
  - interface_direction
  - product_specification
  - visual_review_coordination
- id: MGR-RESEARCH
  kind: manager
  name: Research Manager
  reports_to: ROLE-CHIEF-OF-STAFF
  domain: research
  responsibilities:
  - documentary_exploration
  - source_verification
  - long_context_synthesis
- id: MGR-LEARNING-EVALUATION
  kind: manager
  name: Mnemosyne
  reports_to: ROLE-CHIEF-OF-STAFF
  domain: learning_evaluation
  responsibilities:
  - mission_evaluation
  - model_evaluation
  - routing_evaluation
  - missed_items
  - pedagogy_brief
  - improvement_proposals
  must_not:
  - mutate_constitution_alone
  - mutate_router_alone
  - produce_closure
  - definitive_conclusion_from_single_mission
- id: AGENT-ARCHITECTURE
  kind: specialized_agent
  name: Architecture Agent
  reports_to: MGR-ENGINEERING
  domain: engineering
  model_requirements:
    task_profile: architecture
    required_capabilities:
    - filesystem
    preferred_capabilities:
    - shell
    default_effort: high
    minimum_effort: high
    context_class: large
    review_policy: second_family_on_critical
