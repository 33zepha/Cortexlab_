kind: model_catalog
status: draft_parallel
discovery_proof: docs/proofs/model-discovery-2026-08-05.json

forbidden_families:
  - gemini
  - antigravity
  - google-generative
  - google

families:
  - id: codex
    vendor: openai
    allowed: true
    access_channels: [codex_subscription_cli]
