# SessionAssignment V2 — aligné Mission Planner V2
schema_version: 2
kind: session_assignment_schema
status: draft_parallel

required:
  - mission_id
  - manager_id
  - agent_role_id
  - session_id
  - status

properties:
  mission_id: { type: string, pattern: '^MIS-.+' }
  manager_id: { type: string, pattern: '^MGR-.+' }
  agent_role_id: { type: string, pattern: '^AGENT-.+' }
  session_id: { type: string }
  status: { type: string, enum: [planned, unassigned, blocked] }
  order: { type: number }
  role_profile: { type: object }

  model:
    type: object
    required: [family, variant, access_channel]
    properties:
      family: { type: string }
      variant: { type: string }
      access_channel: { type: string }
      # provider is LEGACY only — never authoritative in V2 outputs

  effort:
    type: object
    required: [requested, canonical, provider, minimum]
    properties:
      requested: { type: string, enum: [none, low, medium, high, xhigh, max] }
      minimum: { type: string, enum: [none, low, medium, high, xhigh, max] }
      canonical: { type: string, enum: [none, low, medium, high, xhigh, max] }
      provider: { type: string }
      semantics: { type: string }
      mapping_reason: { type: string }
      decision:
        type: object
        properties:
          kind: { type: string, enum: [direct, upward_remap, explicit_reduction] }
          approved_by: { type: string }
          reason: { type: string }

  selection:
    type: object
    properties:
      reason: { type: string }
      confidence: { type: number }
      chosen_score: { type: number }
      rejected_alternatives: { type: array }
      fallback_chain: { type: array }

  requirements:
    type: object
    properties:
      capabilities: { type: array }
      tools: { type: array }
      modalities: { type: array }
      context: { type: number }

  budget:
    type: object
    properties:
      token_limit: { type: number }
      time_limit_minutes: { type: number }
      retry_limit: { type: number }
      correction_limit: { type: number }
      allocation_reason: { type: string }

  proofs_expected: { type: array }

example:
  mission_id: MIS-1042
  manager_id: MGR-ENGINEERING
  agent_role_id: AGENT-FRONTEND-ENGINEER
  session_id: ses_MIS-1042_0_AGENT-FRONTEND-ENGINEER
  status: planned
  order: 0
  model:
    family: codex
    variant: gpt-5.6-luna
    access_channel: codex_subscription_cli
  effort:
    requested: high
    minimum: medium
    canonical: high
    provider: high
    semantics: reasoning_effort
    mapping_reason: direct
    decision: { kind: direct, approved_by: selector, reason: direct }
  selection:
    reason: example
    confidence: 0.8
    chosen_score: 90
    rejected_alternatives: []
    fallback_chain: []
  requirements:
    capabilities: [filesystem, shell, code_execution]
    tools: []
    modalities: []
    context: 0
  budget:
    token_limit: 40000
    time_limit_minutes: 40
    retry_limit: 1
    correction_limit: 1
    allocation_reason: weight_3_of_mission
  proofs_expected: [tests]
